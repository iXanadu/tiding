<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>engram dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        engram: {
                            dark: '#0f172a',
                            darker: '#020617',
                            accent: '#a78bfa',
                            accent2: '#34d399',
                            surface: '#1e293b',
                            border: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; }
        .modal-backdrop { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-engram-darker text-slate-200 min-h-screen" x-data="engramDashboard()" x-init="init()" x-cloak>

    <!-- Header -->
    <header class="bg-engram-dark border-b border-engram-border px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-engram-accent">engram</h1>
            <nav class="flex gap-1 text-sm">
                <button @click="activeTab = 'memories'"
                        class="px-3 py-1 rounded transition"
                        :class="activeTab === 'memories' ? 'bg-engram-accent/20 text-engram-accent' : 'text-slate-500 hover:text-slate-300'">
                    Memories
                </button>
                <button @click="activeTab = 'principals'; fetchPrincipals()"
                        class="px-3 py-1 rounded transition"
                        :class="activeTab === 'principals' ? 'bg-engram-accent/20 text-engram-accent' : 'text-slate-500 hover:text-slate-300'">
                    Principals
                </button>
            </nav>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <template x-if="!tokenSaved">
                <div class="flex items-center gap-2">
                    <input type="password" x-model="tokenInput" placeholder="Bearer token"
                           @keydown.enter="saveToken()"
                           class="bg-engram-dark border border-engram-border rounded px-2 py-1 text-xs text-slate-200 w-48">
                    <button @click="saveToken()" class="text-xs text-engram-accent hover:text-engram-accent/80">Save</button>
                </div>
            </template>
            <template x-if="tokenSaved">
                <button @click="clearToken()" class="text-xs text-slate-500 hover:text-slate-300">clear token</button>
            </template>
            <span class="text-slate-600">|</span>
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="absolute inline-flex h-full w-full rounded-full opacity-75"
                          :class="health.status === 'ok' ? 'bg-engram-accent2 animate-ping' : 'bg-red-400 animate-ping'"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5"
                          :class="health.status === 'ok' ? 'bg-engram-accent2' : 'bg-red-400'"></span>
                </span>
                <span :class="health.status === 'ok' ? 'text-engram-accent2' : 'text-red-400'"
                      x-text="health.status === 'loading' ? 'connecting...' : health.status"></span>
            </div>
            <span class="text-slate-600">|</span>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                <input type="checkbox" x-model="autoRefresh" class="accent-engram-accent h-3.5 w-3.5">
                <span class="text-slate-400">auto-refresh</span>
            </label>
            <span class="text-slate-600" x-show="lastRefresh" x-text="'updated ' + lastRefresh"></span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

      <!-- ==================== MEMORIES TAB ==================== -->
      <template x-if="activeTab === 'memories'">
      <div class="space-y-6">

        <!-- Stats Cards -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Namespaces</h2>
                <button @click="namespace = ''; offset = 0; fetchMemories()"
                        x-show="namespace"
                        class="text-xs text-engram-accent hover:text-engram-accent/80 transition">
                    clear filter
                </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <template x-for="s in stats" :key="s.namespace">
                    <button @click="selectNamespace(s.namespace)"
                            class="bg-engram-surface border rounded-lg p-4 text-left transition hover:border-engram-accent/50 cursor-pointer"
                            :class="namespace === s.namespace ? 'border-engram-accent' : 'border-engram-border'">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-semibold text-engram-accent" x-text="s.namespace"></span>
                            <span class="text-2xl font-bold text-slate-100" x-text="s.count"></span>
                        </div>
                        <div class="text-xs text-slate-500 space-y-0.5">
                            <div x-show="s.expired_count > 0" class="text-amber-400/80">
                                <span x-text="s.expired_count"></span> expired
                            </div>
                            <div>oldest: <span x-text="formatDate(s.oldest)"></span></div>
                            <div>newest: <span x-text="formatDate(s.newest)"></span></div>
                        </div>
                    </button>
                </template>
                <div x-show="stats.length === 0 && authError" class="col-span-full text-red-400 text-sm py-8 text-center" x-text="authError"></div>
                <div x-show="stats.length === 0 && !authError" class="col-span-full text-slate-500 text-sm py-8 text-center">
                    No namespaces found. Store some memories first.
                </div>
            </div>
        </section>

        <!-- Memory Browser -->
        <section class="bg-engram-surface border border-engram-border rounded-lg">
            <!-- Filters Row 1 -->
            <div class="p-4 border-b border-engram-border flex flex-wrap gap-3 items-end">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Namespace</label>
                    <select x-model="namespace" @change="offset = 0; fetchMemories()"
                            class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 min-w-[140px]">
                        <option value="">all</option>
                        <template x-for="s in stats" :key="s.namespace">
                            <option :value="s.namespace" x-text="s.namespace"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Scope</label>
                    <select x-model="scope" @change="offset = 0; fetchMemories()"
                            class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 min-w-[120px]">
                        <option value="">all</option>
                        <option value="shared">shared</option>
                        <option value="machine">machine</option>
                        <option value="project">project</option>
                        <option value="user">user</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">User ID</label>
                    <input type="text" x-model.debounce.400ms="userId"
                           @input="offset = 0; fetchMemories()"
                           placeholder="any"
                           class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-32">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Machine</label>
                    <select x-model="machine" @change="offset = 0; fetchMemories()"
                            class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 min-w-[120px]">
                        <option value="">all</option>
                        <template x-for="m in machines" :key="m">
                            <option :value="m" x-text="m"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Key prefix</label>
                    <input type="text" x-model.debounce.400ms="keyPrefix"
                           @input="offset = 0; fetchMemories()"
                           placeholder="e.g. session/"
                           class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-40">
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs text-slate-500 mb-1">Search (key + value)</label>
                    <input type="text" x-model.debounce.400ms="search"
                           @input="offset = 0; fetchMemories()"
                           placeholder="fuzzy search across keys and values..."
                           class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-full">
                </div>
            </div>

            <!-- Filters Row 2: Date Range -->
            <div class="px-4 py-2.5 border-b border-engram-border/50 flex flex-wrap gap-2 items-center">
                <span class="text-xs text-slate-500 mr-1">Created:</span>
                <template x-for="preset in datePresets" :key="preset.label">
                    <button @click="applyDatePreset(preset)"
                            class="px-2.5 py-1 rounded text-xs border transition"
                            :class="activeDatePreset === preset.label
                                ? 'border-engram-accent text-engram-accent bg-engram-accent/10'
                                : 'border-engram-border text-slate-400 hover:text-slate-200 hover:border-engram-accent/50'"
                            x-text="preset.label">
                    </button>
                </template>
                <span class="text-slate-600 mx-1">|</span>
                <div class="flex items-center gap-1.5">
                    <input type="date" x-model="customDateFrom"
                           @change="applyCustomDates()"
                           class="bg-engram-dark border border-engram-border rounded px-2 py-1 text-xs text-slate-300 w-[130px]">
                    <span class="text-slate-500 text-xs">to</span>
                    <input type="date" x-model="customDateTo"
                           @change="applyCustomDates()"
                           class="bg-engram-dark border border-engram-border rounded px-2 py-1 text-xs text-slate-300 w-[130px]">
                </div>
                <button x-show="activeDatePreset || customDateFrom || customDateTo"
                        @click="clearDateFilter()"
                        class="text-xs text-red-400/70 hover:text-red-400 transition ml-1">
                    clear dates
                </button>
            </div>

            <!-- Memory Grid -->
            <div class="overflow-x-auto text-sm">
                <!-- Header -->
                <div class="grid text-left text-xs text-slate-500 uppercase tracking-wider border-b border-engram-border"
                     style="grid-template-columns: minmax(0,3fr) 80px minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) 80px 90px 90px 80px 50px">
                    <div class="px-4 py-2.5 cursor-pointer hover:text-slate-300 select-none" @click="toggleSort('key')">
                        Key <span x-show="sortBy === 'key'" x-text="sortOrder === 'asc' ? ' \u2191' : ' \u2193'"></span>
                    </div>
                    <div class="px-4 py-2.5">Scope</div>
                    <div class="px-4 py-2.5">User ID</div>
                    <div class="px-4 py-2.5">Owner</div>
                    <div class="px-4 py-2.5">Tags</div>
                    <div class="px-4 py-2.5">Source</div>
                    <div class="px-4 py-2.5 cursor-pointer hover:text-slate-300 select-none" @click="toggleSort('created_at')">
                        Created <span x-show="sortBy === 'created_at'" x-text="sortOrder === 'asc' ? ' \u2191' : ' \u2193'"></span>
                    </div>
                    <div class="px-4 py-2.5 cursor-pointer hover:text-slate-300 select-none" @click="toggleSort('last_used_at')">
                        Last Used <span x-show="sortBy === 'last_used_at'" x-text="sortOrder === 'asc' ? ' \u2191' : ' \u2193'"></span>
                    </div>
                    <div class="px-4 py-2.5">Expires</div>
                    <div class="px-4 py-2.5"></div>
                </div>
                <!-- Rows -->
                <template x-for="(m, idx) in memories" :key="m.namespace + '|' + m.key + '|' + m.scope + '|' + m.user_id">
                    <div>
                        <div class="grid border-b border-engram-border/50 cursor-pointer hover:bg-engram-dark/40 transition"
                             style="grid-template-columns: minmax(0,3fr) 80px minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) 80px 90px 90px 80px 50px"
                             @click="expandRow(m)">
                            <div class="px-4 py-2 truncate text-engram-accent" :title="m.key" x-text="m.key"></div>
                            <div class="px-4 py-2 text-slate-400" x-text="m.scope"></div>
                            <div class="px-4 py-2 truncate text-slate-400" :title="m.user_id" x-text="m.user_id"></div>
                            <div class="px-4 py-2 truncate text-engram-accent2" :title="m.owner" x-text="m.owner || '—'"></div>
                            <div class="px-4 py-2 truncate text-slate-500" :title="m.tags" x-text="m.tags || '—'"></div>
                            <div class="px-4 py-2 truncate text-slate-500"
                                 :title="m.metadata ? [m.metadata.principal, m.metadata.machine].filter(Boolean).join(' @ ') : ''"
                                 x-text="m.metadata && m.metadata.machine ? m.metadata.machine : '—'"></div>
                            <div class="px-4 py-2 text-slate-500 whitespace-nowrap" x-text="formatDate(m.created_at)"></div>
                            <div class="px-4 py-2 text-slate-500 whitespace-nowrap" x-text="formatDate(m.last_used_at)"></div>
                            <div class="px-4 py-2 whitespace-nowrap"
                                 :class="isExpired(m.expires_at) ? 'text-amber-400' : 'text-slate-500'"
                                 x-text="m.expires_at ? formatDate(m.expires_at) : '—'"></div>
                            <div class="px-4 py-2 text-right">
                                <button @click.stop="openEdit(m)"
                                        class="text-slate-500 hover:text-engram-accent transition text-xs px-1.5 py-0.5 rounded border border-transparent hover:border-engram-accent/30"
                                        title="Edit memory">edit</button>
                            </div>
                        </div>
                        <!-- Expanded detail -->
                        <div x-show="expandedId === rowId(m)" class="bg-engram-dark/60 px-4 py-3 border-b border-engram-border/50">
                            <div x-show="expandedLoading" class="text-slate-500 text-xs">Loading value...</div>
                            <pre x-show="!expandedLoading"
                                 class="text-xs text-slate-300 whitespace-pre-wrap break-all max-h-64 overflow-y-auto"
                                 x-text="expandedValue"></pre>
                            <div x-show="!expandedLoading && m.metadata" class="mt-2 pt-2 border-t border-engram-border/30 flex gap-4 text-xs text-slate-500">
                                <span x-show="m.metadata && m.metadata.principal">principal: <span class="text-slate-400" x-text="m.metadata?.principal"></span></span>
                                <span x-show="m.metadata && m.metadata.machine">machine: <span class="text-slate-400" x-text="m.metadata?.machine"></span></span>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="memories.length === 0 && !loading" class="py-8 text-center text-slate-500">
                    No memories found.
                </div>
            </div>

            <!-- Pagination -->
            <div x-show="total > 0" class="px-4 py-3 border-t border-engram-border flex items-center justify-between text-sm">
                <span class="text-slate-500">
                    <span x-text="offset + 1"></span>–<span x-text="Math.min(offset + limit, total)"></span>
                    of <span class="text-slate-300" x-text="total"></span>
                </span>
                <div class="flex gap-2">
                    <button @click="prevPage()" :disabled="offset === 0"
                            class="px-3 py-1 rounded border border-engram-border text-slate-400 hover:text-slate-200 hover:border-engram-accent/50 disabled:opacity-30 disabled:cursor-not-allowed transition">
                        prev
                    </button>
                    <button @click="nextPage()" :disabled="offset + limit >= total"
                            class="px-3 py-1 rounded border border-engram-border text-slate-400 hover:text-slate-200 hover:border-engram-accent/50 disabled:opacity-30 disabled:cursor-not-allowed transition">
                        next
                    </button>
                </div>
            </div>
        </section>

        <!-- Loading overlay -->
        <div x-show="loading" class="fixed bottom-4 right-4 bg-engram-surface border border-engram-border rounded-lg px-4 py-2 text-sm text-slate-400 shadow-lg">
            Loading...
        </div>

      </div>
      </template>

      <!-- ==================== PRINCIPALS TAB ==================== -->
      <template x-if="activeTab === 'principals'">
      <div class="space-y-6">

        <!-- Principal List Header -->
        <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Principals</h2>
            <button @click="openCreatePrincipal()"
                    class="px-3 py-1.5 rounded bg-engram-accent text-engram-darker font-semibold text-xs hover:bg-engram-accent/90 transition">
                + New Principal
            </button>
        </div>

        <!-- Auth error -->
        <div x-show="principalsError" class="text-red-400 text-sm py-4 text-center" x-text="principalsError"></div>

        <!-- Principal Cards -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <template x-for="p in principals" :key="p.id">
                <div class="bg-engram-surface border rounded-lg p-5 transition hover:border-engram-accent/50"
                     :class="p.active ? 'border-engram-border' : 'border-red-900/50 opacity-60'">
                    <!-- Top row: name + badges -->
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg" :class="p.type === 'human' ? 'text-engram-accent' : 'text-sky-400'" x-text="p.name"></span>
                            <span class="px-1.5 py-0.5 rounded text-[10px] uppercase tracking-wider font-semibold"
                                  :class="p.type === 'human' ? 'bg-engram-accent/20 text-engram-accent' : 'bg-sky-400/20 text-sky-400'"
                                  x-text="p.type"></span>
                            <span x-show="p.is_admin" class="px-1.5 py-0.5 rounded text-[10px] uppercase tracking-wider font-semibold bg-amber-400/20 text-amber-400">admin</span>
                            <span x-show="!p.active" class="px-1.5 py-0.5 rounded text-[10px] uppercase tracking-wider font-semibold bg-red-400/20 text-red-400">inactive</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button @click="openEditPrincipal(p)"
                                    class="text-xs text-slate-500 hover:text-engram-accent transition px-2 py-1 rounded border border-transparent hover:border-engram-accent/30">
                                edit
                            </button>
                        </div>
                    </div>

                    <!-- Permissions -->
                    <div class="space-y-2 text-xs">
                        <div class="flex gap-4">
                            <div>
                                <span class="text-slate-500">read:</span>
                                <span class="text-engram-accent2 ml-1" x-text="p.read_namespaces.length ? p.read_namespaces.join(', ') : 'none'"></span>
                            </div>
                            <div>
                                <span class="text-slate-500">write:</span>
                                <span class="text-amber-300 ml-1" x-text="p.write_namespaces.length ? p.write_namespaces.join(', ') : 'none'"></span>
                            </div>
                        </div>

                        <!-- Token + auth -->
                        <div class="flex gap-4 text-slate-500">
                            <span>token: <span :class="p.has_token ? 'text-engram-accent2' : 'text-red-400'" x-text="p.has_token ? 'yes' : 'no'"></span></span>
                            <span>password: <span :class="p.has_password ? 'text-engram-accent2' : 'text-slate-600'" x-text="p.has_password ? 'yes' : 'no'"></span></span>
                            <span>created: <span class="text-slate-400" x-text="formatDate(p.created_at)"></span></span>
                        </div>

                        <!-- Aliases -->
                        <div x-show="p._aliases && p._aliases.length > 0" class="pt-1 border-t border-engram-border/30">
                            <span class="text-slate-500">aliases:</span>
                            <template x-for="a in (p._aliases || [])" :key="a.id">
                                <span class="ml-1.5 inline-flex items-center gap-1 bg-engram-dark/60 rounded px-1.5 py-0.5 text-slate-300">
                                    <span x-text="a.alias"></span>
                                    <span class="text-slate-600" x-text="'(' + a.source + ')'"></span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="principals.length === 0 && !principalsError" class="text-slate-500 text-sm py-8 text-center">
            No principals found. Create one to get started.
        </div>

      </div>
      </template>

    </main>

    <!-- ==================== CREATE PRINCIPAL MODAL ==================== -->
    <div x-show="createModal.open" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
         x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @keydown.escape.window="createModal.open = false">
        <div class="bg-engram-surface border border-engram-border rounded-xl shadow-2xl w-full max-w-lg mx-4"
             @click.outside="createModal.open = false">
            <div class="px-6 py-4 border-b border-engram-border flex items-center justify-between">
                <h3 class="text-sm font-semibold text-engram-accent uppercase tracking-wider">New Principal</h3>
                <button @click="createModal.open = false" class="text-slate-500 hover:text-slate-300 text-lg">&times;</button>
            </div>
            <div class="px-6 py-4 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Name</label>
                        <input type="text" x-model="createModal.name" placeholder="e.g. ixanadu"
                               class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-full">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Type</label>
                        <select x-model="createModal.type"
                                class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-full">
                            <option value="human">human</option>
                            <option value="agent">agent</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer select-none text-sm">
                        <input type="checkbox" x-model="createModal.is_admin" class="accent-engram-accent h-3.5 w-3.5">
                        <span class="text-slate-300">Admin</span>
                    </label>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Read namespaces <span class="text-slate-600">(comma-separated)</span></label>
                    <input type="text" x-model="createModal.read_ns" placeholder="claude-code, ha"
                           class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-full">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Write namespaces <span class="text-slate-600">(comma-separated)</span></label>
                    <input type="text" x-model="createModal.write_ns" placeholder="claude-code"
                           class="bg-engram-dark border border-engram-border rounded px-2.5 py-1.5 text-sm text-slate-200 w-full">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Password <span class="text-slate-600">(optional, for dashboard login later)</span></label>

                        <span x-text="editModal.saving ? 'Saving...' : 'Save'"></span>

    <script>
    function engramDashboard() {
        return {
            // Auth
            tokenInput: '',
            tokenSaved: false,

            // Navigation
            activeTab: 'memories',

            // State
            health: { status: 'loading', checks: {} },
            stats: [],
            memories: [],
            total: 0,
            loading: false,
            authError: '',

            // Principals state
            principals: [],
            principalsError: '',
            createModal: { open: false, saving: false, error: '', name: '', type: 'human', is_admin: false, read_ns: '', write_ns: '', password: '' },
            tokenReveal: { open: false, token: '', name: '', copied: false },
            principalEdit: {
                open: false, saving: false, error: '',
                id: '', name: '', type: '', is_admin: false, active: true,
                read_ns: '', write_ns: '', has_token: false, has_password: false,
                aliases: [], newAlias: '', newAliasSource: '',
                _orig: {},
            },

            // Filters
            namespace: '',
            scope: '',
            userId: '',
            machine: '',
            machines: [],
            keyPrefix: '',
            search: '',
            createdAfter: null,
            createdBefore: null,
            offset: 0,
            limit: 50,
            sortBy: 'created_at',
            sortOrder: 'desc',

            // Date presets
            activeDatePreset: null,
            customDateFrom: '',
            customDateTo: '',
            datePresets: [
                { label: 'Today', days: 0 },
                { label: 'This week', days: 7 },
                { label: 'Last week', daysFrom: 14, daysTo: 7 },
                { label: 'Last month', days: 30 },
                { label: 'Last 3 months', days: 90 },
            ],

            // UI
            expandedId: null,
            expandedValue: '',
            expandedLoading: false,
            autoRefresh: true,
            lastRefresh: null,

            // Edit modal
            editModal: {
                open: false,
                saving: false,
                error: '',
                // Original values (for identifying the row and detecting changes)
                origNamespace: '',
                origScope: '',
                origUserId: '',
                origKey: '',
                origTags: '',
                value: '',
                // Editable fields
                namespace: '',
                scope: '',
                userId: '',
                key: '',
                tags: '',
                dirty() {
                    return this.namespace !== this.origNamespace
                        || this.scope !== this.origScope
                        || this.userId !== this.origUserId
                        || this.key !== this.origKey
                        || this.tags !== this.origTags;
                },
                changesSummary() {
                    const changes = [];
                    if (this.namespace !== this.origNamespace) changes.push('namespace');
                    if (this.scope !== this.origScope) changes.push('scope');
                    if (this.userId !== this.origUserId) changes.push('user_id');
                    if (this.key !== this.origKey) changes.push('key');
                    if (this.tags !== this.origTags) changes.push('tags');
                    return changes.length ? 'Changing: ' + changes.join(', ') : '';
                },
            },

            authHeaders() {
                const h = {};
                const token = localStorage.getItem('engram_token');
                if (token) h['Authorization'] = `Bearer ${token}`;
                return h;
            },

            saveToken() {
                if (this.tokenInput.trim()) {
                    localStorage.setItem('engram_token', this.tokenInput.trim());
                    this.tokenInput = '';
                    this.tokenSaved = true;
                    this.authError = '';
                    this.refresh();
                }
            },

            clearToken() {
                localStorage.removeItem('engram_token');
                this.tokenSaved = false;
            },

            async init() {
                this.tokenSaved = !!localStorage.getItem('engram_token');
                await Promise.all([this.fetchHealth(), this.fetchStats(), this.fetchMachines()]);
                await this.fetchMemories();
                setInterval(() => {
                    if (this.autoRefresh) this.refresh();
                }, 30000);
            },

            async refresh() {
                await this.fetchHealth();
                await this.fetchStats();
                await this.fetchMemories();
                this.lastRefresh = new Date().toLocaleTimeString();
            },

            async fetchHealth() {
                try {
                    const r = await fetch('/health');
                    this.health = await r.json();
                } catch {
                    this.health = { status: 'error', checks: {} };
                }
            },

            async fetchMachines() {
                try {
                    const r = await fetch('/admin/machines', { headers: this.authHeaders() });
                    if (r.ok) {
                        const data = await r.json();
                        this.machines = data.machines || [];
                    }
                } catch {}
            },

            async fetchStats() {
                try {
                    const r = await fetch('/admin/stats', { headers: this.authHeaders() });
                    if (r.status === 401 || r.status === 403) {
                        const data = await r.json();
                        this.authError = data.detail || (r.status === 401 ? 'Token required — enter an admin Bearer token above.' : 'Admin access required — this token lacks admin privileges.');
                        this.stats = [];
                        return;
                    }
                    this.authError = '';
                    const data = await r.json();
                    this.stats = data.stats || [];
                } catch {
                    this.stats = [];
                }
            },

            async fetchMemories() {
                this.loading = true;
                try {
                    if (this.authError) { this.memories = []; this.total = 0; return; }
                    const params = new URLSearchParams({
                        offset: this.offset,
                        limit: this.limit,
                        sort_by: this.sortBy,
                        sort_order: this.sortOrder,
                    });
                    if (this.namespace) params.set('namespace', this.namespace);
                    if (this.scope) params.set('scope', this.scope);
                    if (this.userId) params.set('user_id', this.userId);
                    if (this.machine) params.set('machine', this.machine);
                    if (this.keyPrefix) params.set('key_prefix', this.keyPrefix);
                    if (this.search) params.set('search', this.search);
                    if (this.createdAfter) params.set('created_after', this.createdAfter);
                    if (this.createdBefore) params.set('created_before', this.createdBefore);

                    const r = await fetch('/admin/memories?' + params, { headers: this.authHeaders() });
                    const data = await r.json();
                    this.memories = data.items || [];
                    this.total = data.total || 0;
                } catch {
                    this.memories = [];
                    this.total = 0;
                } finally {
                    this.loading = false;
                }
            },

            // Date presets
            applyDatePreset(preset) {
                const now = new Date();
                this.activeDatePreset = preset.label;
                this.customDateFrom = '';
                this.customDateTo = '';

                if (preset.daysFrom !== undefined) {
                    // Range like "last week" (14 days ago to 7 days ago)
                    const from = new Date(now);
                    from.setDate(from.getDate() - preset.daysFrom);
                    from.setHours(0, 0, 0, 0);
                    const to = new Date(now);
                    to.setDate(to.getDate() - preset.daysTo);
                    to.setHours(0, 0, 0, 0);
                    this.createdAfter = from.toISOString();
                    this.createdBefore = to.toISOString();
                } else {
                    // "Last N days" or "Today"
                    const from = new Date(now);
                    from.setDate(from.getDate() - preset.days);
                    from.setHours(0, 0, 0, 0);
                    this.createdAfter = from.toISOString();
                    this.createdBefore = null;
                }
                this.offset = 0;
                this.fetchMemories();
            },

            applyCustomDates() {
                this.activeDatePreset = null;
                if (this.customDateFrom) {
                    this.createdAfter = new Date(this.customDateFrom + 'T00:00:00').toISOString();
                } else {
                    this.createdAfter = null;
                }
                if (this.customDateTo) {
                    // End of day
                    this.createdBefore = new Date(this.customDateTo + 'T23:59:59').toISOString();
                } else {
                    this.createdBefore = null;
                }
                this.offset = 0;
                this.fetchMemories();
            },

            clearDateFilter() {
                this.activeDatePreset = null;
                this.customDateFrom = '';
                this.customDateTo = '';
                this.createdAfter = null;
                this.createdBefore = null;
                this.offset = 0;
                this.fetchMemories();
            },

            rowId(m) {
                return m.namespace + '|' + m.key + '|' + m.scope + '|' + m.user_id;
            },

            async expandRow(m) {
                const id = this.rowId(m);
                if (this.expandedId === id) {
                    this.expandedId = null;
                    return;
                }
                this.expandedId = id;
                this.expandedLoading = true;
                this.expandedValue = '';
                try {
                    const params = new URLSearchParams({
                        namespace: m.namespace,
                        key_prefix: m.key,
                        scope: m.scope,
                        user_id: m.user_id,
                        include_value: 'true',
                        value_max_length: '10000',
                        limit: '1',
                    });
                    const r = await fetch('/admin/memories?' + params, { headers: this.authHeaders() });
                    const data = await r.json();
                    if (data.items && data.items.length > 0) {
                        this.expandedValue = data.items[0].value || '(empty)';
                    } else {
                        this.expandedValue = '(not found)';
                    }
                } catch {
                    this.expandedValue = '(error loading value)';
                } finally {
                    this.expandedLoading = false;
                }
            },

            // Edit modal
            async openEdit(m) {
                this.editModal.error = '';
                this.editModal.saving = false;
                this.editModal.origNamespace = m.namespace;
                this.editModal.origScope = m.scope;
                this.editModal.origUserId = m.user_id;
                this.editModal.origKey = m.key;
                this.editModal.origTags = m.tags || '';
                this.editModal.namespace = m.namespace;
                this.editModal.scope = m.scope;
                this.editModal.userId = m.user_id;
                this.editModal.key = m.key;
                this.editModal.tags = m.tags || '';
                this.editModal.value = '';
                this.editModal.open = true;

                // Load full value
                try {
                    const params = new URLSearchParams({
                        namespace: m.namespace,
                        key_prefix: m.key,
                        scope: m.scope,
                        user_id: m.user_id,
                        include_value: 'true',
                        value_max_length: '10000',
                        limit: '1',
                    });
                    const r = await fetch('/admin/memories?' + params, { headers: this.authHeaders() });
                    const data = await r.json();
                    if (data.items && data.items.length > 0) {
                        this.editModal.value = data.items[0].value || '(empty)';
                    }
                } catch {
                    this.editModal.value = '(error loading)';
                }
            },

            async saveEdit() {
                this.editModal.saving = true;
                this.editModal.error = '';
                try {
                    const body = {
                        namespace: this.editModal.origNamespace,
                        key: this.editModal.origKey,
                        scope: this.editModal.origScope,
                        user_id: this.editModal.origUserId,
                    };
                    if (this.editModal.namespace !== this.editModal.origNamespace) body.new_namespace = this.editModal.namespace;
                    if (this.editModal.scope !== this.editModal.origScope) body.new_scope = this.editModal.scope;
                    if (this.editModal.userId !== this.editModal.origUserId) body.new_user_id = this.editModal.userId;
                    if (this.editModal.key !== this.editModal.origKey) body.new_key = this.editModal.key;
                    if (this.editModal.tags !== this.editModal.origTags) body.new_tags = this.editModal.tags;

                    const r = await fetch('/admin/memories', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json', ...this.authHeaders() },
                        body: JSON.stringify(body),
                    });
                    const data = await r.json();
                    if (!r.ok) {
                        this.editModal.error = data.detail || 'Update failed';
                        return;
                    }
                    this.editModal.open = false;
                    this.expandedId = null;
                    await Promise.all([this.fetchStats(), this.fetchMemories()]);
                } catch (e) {
                    this.editModal.error = 'Network error: ' + e.message;
                } finally {
                    this.editModal.saving = false;
                }
            },

            // Pagination
            prevPage() {
                this.offset = Math.max(0, this.offset - this.limit);
                this.expandedId = null;
                this.fetchMemories();
            },
            nextPage() {
                this.offset += this.limit;
                this.expandedId = null;
                this.fetchMemories();
            },

            // Sorting
            toggleSort(col) {
                if (this.sortBy === col) {
                    this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    this.sortBy = col;
                    this.sortOrder = col === 'key' ? 'asc' : 'desc';
                }
                this.offset = 0;
                this.expandedId = null;
                this.fetchMemories();
            },

            // Namespace card click
            selectNamespace(ns) {
                this.namespace = ns;
                this.offset = 0;
                this.expandedId = null;
                this.fetchMemories();
            },

            // Formatting
            formatDate(d) {
                if (!d) return '—';
                const dt = new Date(d);
                const now = new Date();
                const diff = now - dt;
                if (diff < 60000) return 'just now';
                if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
                if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
                if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
                return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: dt.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
            },

            isExpired(d) {
                if (!d) return false;
                return new Date(d) <= new Date();
            },

            // ==================== PRINCIPALS ====================

            _parseNs(str) {
                return str.split(',').map(s => s.trim()).filter(Boolean);
            },

            async fetchPrincipals() {
                try {
                    const r = await fetch('/admin/principals?active_only=false', { headers: this.authHeaders() });
                    if (r.status === 401 || r.status === 403) {
                        const data = await r.json();
                        this.principalsError = data.detail || 'Admin access required.';
                        this.principals = [];
                        return;
                    }
                    this.principalsError = '';
                    const data = await r.json();
                    const list = data.principals || [];
                    for (const p of list) {
                        try {
                            const ar = await fetch(`/admin/principals/${encodeURIComponent(p.name)}/aliases`, { headers: this.authHeaders() });
                            const ad = await ar.json();
                            p._aliases = ad.aliases || [];
                        } catch { p._aliases = []; }
                    }
                    this.principals = list;
                } catch {
                    this.principals = [];
                }
            },

            openCreatePrincipal() {
                this.createModal = { open: true, saving: false, error: '', name: '', type: 'human', is_admin: false, read_ns: '', write_ns: '', password: '' };
            },

            async saveCreatePrincipal() {
                this.createModal.saving = true;
                this.createModal.error = '';
                try {
                    const body = {
                        name: this.createModal.name.trim(),
                        type: this.createModal.type,
                        is_admin: this.createModal.is_admin,
                        read_namespaces: this._parseNs(this.createModal.read_ns),
                        write_namespaces: this._parseNs(this.createModal.write_ns),
                    };
                    if (this.createModal.password.trim()) body.password = this.createModal.password;
                    const r = await fetch('/admin/principals', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...this.authHeaders() },
                        body: JSON.stringify(body),
                    });
                    const data = await r.json();
                    if (!r.ok) { this.createModal.error = data.detail || 'Create failed'; return; }
                    this.createModal.open = false;
                    if (data.raw_token) {
                        this.tokenReveal = { open: true, token: data.raw_token, name: body.name, copied: false };
                    }
                    await this.fetchPrincipals();
                } catch (e) {
                    this.createModal.error = 'Network error: ' + e.message;
                } finally {
                    this.createModal.saving = false;
                }
            },

            async openEditPrincipal(p) {
                this.principalEdit = {
                    open: true, saving: false, error: '',
                    id: p.id, name: p.name, type: p.type,
                    is_admin: p.is_admin, active: p.active,
                    read_ns: p.read_namespaces.join(', '),
                    write_ns: p.write_namespaces.join(', '),
                    has_token: p.has_token, has_password: p.has_password,
                    aliases: p._aliases || [],
                    newAlias: '', newAliasSource: '',
                    _orig: {
                        is_admin: p.is_admin, active: p.active,
                        read_ns: p.read_namespaces.join(', '),
                        write_ns: p.write_namespaces.join(', '),
                    },
                };
            },

            async saveEditPrincipal() {
                this.principalEdit.saving = true;
                this.principalEdit.error = '';
                try {
                    const body = {};
                    const o = this.principalEdit._orig;
                    if (this.principalEdit.is_admin !== o.is_admin) body.is_admin = this.principalEdit.is_admin;
                    if (this.principalEdit.active !== o.active) body.active = this.principalEdit.active;
                    if (this.principalEdit.read_ns !== o.read_ns) body.read_namespaces = this._parseNs(this.principalEdit.read_ns);
                    if (this.principalEdit.write_ns !== o.write_ns) body.write_namespaces = this._parseNs(this.principalEdit.write_ns);
                    if (Object.keys(body).length === 0) { this.principalEdit.open = false; return; }
                    const r = await fetch(`/admin/principals/${encodeURIComponent(this.principalEdit.name)}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json', ...this.authHeaders() },
                        body: JSON.stringify(body),
                    });
                    const data = await r.json();
                    if (!r.ok) { this.principalEdit.error = data.detail || 'Update failed'; return; }
                    this.principalEdit.open = false;
                    await this.fetchPrincipals();
                } catch (e) {
                    this.principalEdit.error = 'Network error: ' + e.message;
                } finally {
                    this.principalEdit.saving = false;
                }
            },

            async regenerateToken(name) {
                if (!confirm(`Regenerate token for "${name}"? The current token will stop working immediately.`)) return;
                try {
                    const r = await fetch(`/admin/principals/${encodeURIComponent(name)}/token`, {
                        method: 'POST',
                        headers: this.authHeaders(),
                    });
                    const data = await r.json();
                    if (!r.ok) { this.principalEdit.error = data.detail || 'Token regeneration failed'; return; }
                    this.principalEdit.has_token = true;
                    this.tokenReveal = { open: true, token: data.raw_token, name: name, copied: false };
                } catch (e) {
                    this.principalEdit.error = 'Network error: ' + e.message;
                }
            },

            async addAlias(principalName) {
                const alias = this.principalEdit.newAlias.trim();
                const source = this.principalEdit.newAliasSource.trim();
                if (!alias || !source) return;
                try {
                    const r = await fetch(`/admin/principals/${encodeURIComponent(principalName)}/aliases`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...this.authHeaders() },
                        body: JSON.stringify({ alias, source }),
                    });
                    const data = await r.json();
                    if (!r.ok) { this.principalEdit.error = data.detail || 'Add alias failed'; return; }
                    this.principalEdit.aliases.push(data);
                    this.principalEdit.newAlias = '';
                    this.principalEdit.newAliasSource = '';
                } catch (e) {
                    this.principalEdit.error = 'Network error: ' + e.message;
                }
            },

            async removeAlias(principalName, alias, source) {
                try {
                    const r = await fetch(`/admin/principals/${encodeURIComponent(principalName)}/aliases`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', ...this.authHeaders() },
                        body: JSON.stringify({ alias, source }),
                    });
                    if (r.ok) {
                        this.principalEdit.aliases = this.principalEdit.aliases.filter(a => !(a.alias === alias && a.source === source));
                    }
                } catch {}
            },
        };
    }
    </script>
</body>
