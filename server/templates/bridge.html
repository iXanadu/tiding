<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>engram bridge</title>
    <!-- Locally served, pinned assets — no CDN (2026-07-21 audit).
         Rebuild with scripts/build-dashboard-assets.sh when classes change. -->
    <link rel="stylesheet" href="/static/bridge.css">
    <script defer src="/static/alpine-3.14.9.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; }
    </style>
</head>
<body class="bg-engram-darker text-slate-200 min-h-screen" x-data="engramBridge()" x-init="init()" x-cloak>

    <div class="max-w-4xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-engram-accent">engram bridge</h1>
                <p class="text-xs text-slate-500 mt-1">Multi-AI memory interface</p>
            </div>
            <div class="flex items-center gap-3">
                <template x-if="!tokenSaved">
                    <div class="flex items-center gap-2">
                        <input type="password" x-model="tokenInput" placeholder="Bearer token"
                               @keydown.enter="saveToken()"
                               class="bg-engram-dark border border-engram-border rounded px-2 py-1 text-xs text-slate-200 w-48">
                        <button @click="saveToken()" class="text-xs text-engram-accent hover:text-engram-accent/80">Save</button>
                    </div>
                </template>
                <template x-if="tokenSaved">
                    <button @click="clearToken()" class="text-xs text-slate-500 hover:text-slate-300">clear token</button>
                </template>
                <span class="text-xs px-2 py-1 rounded-full"
                      :class="connected ? 'bg-green-900/40 text-green-400' : 'bg-red-900/40 text-red-400'"
                      x-text="connected ? 'connected' : 'disconnected'"></span>
            </div>
        </div>

        <!-- Search -->
        <section class="bg-engram-surface border border-engram-border rounded-lg p-4 mb-4">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Search Memories</h2>
            <div class="flex flex-wrap gap-3 mb-3">
                <div class="flex-1 min-w-[250px]">
                    <input type="text" x-model="searchQuery" @keydown.enter="search()"
                           placeholder="Search across all AI memories..."
                           class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full focus:border-engram-accent focus:outline-none">
                </div>
                <div>
                    <select x-model="searchScope"
                            class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200">
                        <option value="shared">shared</option>
                        <option value="project">project</option>
                        <option value="machine">machine</option>
                    </select>
                </div>
                <div x-show="searchScope === 'project'">
                    <input type="text" x-model="searchUserId" placeholder="project name"
                           class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-36">
                </div>
                <div x-show="searchScope === 'machine'">
                    <input type="text" x-model="searchUserId" placeholder="hostname"
                           class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-36">
                </div>
                <button @click="search()"
                        class="bg-engram-accent/20 text-engram-accent border border-engram-accent/30 rounded px-4 py-2 text-sm hover:bg-engram-accent/30 transition">
                    Search
                </button>
            </div>
            <!-- Namespace toggles -->
            <div class="flex gap-2 items-center">
                <span class="text-xs text-slate-500">Namespaces:</span>
                <template x-for="ns in allNamespaces" :key="ns">
                    <label class="flex items-center gap-1 text-xs cursor-pointer">
                        <input type="checkbox" :value="ns" x-model="selectedNamespaces"
                               class="rounded border-engram-border bg-engram-dark">
                        <span :class="nsColor(ns)" x-text="ns"></span>
                    </label>
                </template>
            </div>
        </section>

        <!-- Results -->
        <section x-show="results.length > 0" class="bg-engram-surface border border-engram-border rounded-lg mb-4">
            <div class="p-3 border-b border-engram-border flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">
                    Results <span class="text-slate-500" x-text="'(' + results.length + ')'"></span>
                </h2>
            </div>
            <template x-for="(r, i) in results" :key="i">
                <div class="p-3 border-b border-engram-border last:border-0 hover:bg-engram-dark/50 transition">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs font-medium px-1.5 py-0.5 rounded"
                              :class="nsBadge(r.namespace)"
                              x-text="r.namespace"></span>
                        <span class="text-engram-accent text-sm font-medium" x-text="r.key"></span>
                        <span class="text-xs text-slate-500 ml-auto" x-text="r.scope + '/' + r.user_id"></span>
                        <span class="text-xs text-slate-600" x-text="r.score?.toFixed(3)"></span>
                    </div>
                    <div class="text-sm text-slate-300 whitespace-pre-wrap break-words mt-1" x-text="r.value"></div>
                    <div x-show="r.tags" class="mt-1">
                        <template x-for="tag in r.tags.split(',')" :key="tag">
                            <span class="text-xs text-slate-500 bg-engram-dark px-1.5 py-0.5 rounded mr-1" x-text="tag.trim()"></span>
                        </template>
                    </div>
                </div>
            </template>
        </section>

        <div x-show="searched && results.length === 0" class="text-center text-slate-500 text-sm py-8">
            No memories found.
        </div>

        <!-- Store -->
        <section class="bg-engram-surface border border-engram-border rounded-lg p-4 mt-4">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Store Memory</h2>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Namespace</label>
                    <select x-model="storeNs"
                            class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full">
                        <template x-for="ns in allNamespaces" :key="ns">
                            <option :value="ns" x-text="ns"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Key</label>
                    <input type="text" x-model="storeKey" placeholder="e.g. lesson/my-discovery"
                           class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Scope</label>
                    <select x-model="storeScope"
                            class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full">
                        <option value="shared">shared</option>
                        <option value="project">project</option>
                        <option value="machine">machine</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">User ID</label>
                    <input type="text" x-model="storeUserId"
                           class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full">
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-xs text-slate-500 mb-1">Tags (comma-separated)</label>
                <input type="text" x-model="storeTags" placeholder="e.g. lesson,fix,architecture"
                       class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full">
            </div>
            <div class="mb-3">
                <label class="block text-xs text-slate-500 mb-1">Value</label>
                <textarea x-model="storeValue" rows="4" placeholder="Memory content..."
                          class="bg-engram-dark border border-engram-border rounded px-3 py-2 text-sm text-slate-200 w-full resize-y"></textarea>
            </div>
            <div class="flex items-center gap-3">
                <button @click="store()"
                        :disabled="!storeKey || !storeValue"
                        class="bg-engram-accent/20 text-engram-accent border border-engram-accent/30 rounded px-4 py-2 text-sm hover:bg-engram-accent/30 transition disabled:opacity-30 disabled:cursor-not-allowed">
                    Store
                </button>
                <span x-show="storeStatus" class="text-xs" :class="storeStatus === 'ok' ? 'text-green-400' : 'text-red-400'" x-text="storeMessage"></span>
            </div>
        </section>
    </div>

    <script>
        function engramBridge() {
            const API = window.location.origin;

            return {
                connected: false,
                allNamespaces: ['claude-code', 'claude-web', 'grok'],
                selectedNamespaces: ['claude-code', 'claude-web', 'grok'],
                searchQuery: '',
                searchScope: 'shared',
                searchUserId: 'global',
                results: [],
                searched: false,

                storeNs: 'claude-web',
                storeKey: '',
                storeScope: 'shared',
                storeUserId: 'global',
                storeTags: '',
                storeValue: '',
                storeStatus: '',
                storeMessage: '',

                tokenInput: '',
                tokenSaved: false,

                authHeaders() {
                    const token = sessionStorage.getItem('engram_token');
                    const h = { 'Content-Type': 'application/json' };
                    if (token) h['Authorization'] = `Bearer ${token}`;
                    return h;
                },

                saveToken() {
                    if (this.tokenInput.trim()) {
                        sessionStorage.setItem('engram_token', this.tokenInput.trim());
                        this.tokenInput = '';
                        this.tokenSaved = true;
                        this.init();
                    }
                },

                clearToken() {
                    sessionStorage.removeItem('engram_token');
                    this.tokenSaved = false;
                    this.connected = false;
                },

                async init() {
                    this.tokenSaved = !!sessionStorage.getItem('engram_token');
                    try {
                        const resp = await fetch(`${API}/health`);
                        this.connected = resp.ok;
                    } catch {
                        this.connected = false;
                    }
                },

                resolveUserId() {
                    if (this.searchScope === 'shared') return 'global';
                    return this.searchUserId || 'global';
                },

                async search() {
                    if (!this.searchQuery.trim()) return;
                    this.searched = true;
                    try {
                        const resp = await fetch(`${API}/memory/search`, {
                            method: 'POST',
                            headers: this.authHeaders(),
                            body: JSON.stringify({
                                namespaces: this.selectedNamespaces,
                                query: this.searchQuery,
                                scope: this.searchScope,
                                user_id: this.resolveUserId(),
                                limit: 20,
                            }),
                        });
                        const data = await resp.json();
                        this.results = data.results || [];
                    } catch (e) {
                        console.error('Search failed:', e);
                        this.results = [];
                    }
                },

                async store() {
                    if (!this.storeKey || !this.storeValue) return;
                    this.storeStatus = '';
                    try {
                        const resp = await fetch(`${API}/memory/set`, {
                            method: 'POST',
                            headers: this.authHeaders(),
                            body: JSON.stringify({
                                namespace: this.storeNs,
                                key: this.storeKey,
                                value: this.storeValue,
                                scope: this.storeScope,
                                user_id: this.storeUserId,
                                tags: this.storeTags,
                            }),
                        });
                        const data = await resp.json();
                        this.storeStatus = data.status;
                        this.storeMessage = data.status === 'ok' ? `Stored: ${data.key}` : 'Failed';
                        if (data.status === 'ok') {
                            this.storeKey = '';
                            this.storeValue = '';
                            this.storeTags = '';
                        }
                    } catch (e) {
                        this.storeStatus = 'error';
                        this.storeMessage = e.message;
                    }
                },

                nsColor(ns) {
                    const colors = {
                        'claude-code': 'text-blue-400',
                        'claude-web': 'text-purple-400',
                        'grok': 'text-orange-400',
                    };
                    return colors[ns] || 'text-slate-400';
                },

                nsBadge(ns) {
                    const badges = {
                        'claude-code': 'bg-blue-900/40 text-blue-400 border border-blue-800/50',
                        'claude-web': 'bg-purple-900/40 text-purple-400 border border-purple-800/50',
                        'grok': 'bg-orange-900/40 text-orange-400 border border-orange-800/50',
                    };
                    return badges[ns] || 'bg-slate-800 text-slate-400 border border-slate-700';
                },
            };
        }
    </script>
</body>
</html>
